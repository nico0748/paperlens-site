<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>PaperLens</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f65a0"/>
      <stop offset="1" stop-color="#4b518a"/>
    </linearGradient>
    <clipPath id="lens"><circle cx="628" cy="592" r="150"/></clipPath>
  </defs>
  <!-- app tile: 824px rounded square (radius 185 = 22.5%), 100px safe margin -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <g transform="translate(-35 0)">
    <!-- paper -->
    <path d="M318 220 H560 L668 328 V756 Q668 788 636 788 H318 Q286 788 286 756 V252 Q286 220 318 220 Z" fill="#fbf8ff"/>
    <!-- folded corner -->
    <path d="M560 220 V300 Q560 328 588 328 H668 Z" fill="#c7c9f2"/>
    <!-- text lines -->
    <g stroke-linecap="round" fill="none">
      <path d="M346 292 H492" stroke="#545a92" stroke-width="28"/>
      <g stroke="#cfd0f3" stroke-width="22">
        <path d="M346 380 H608"/>
        <path d="M346 436 H576"/>
        <path d="M346 492 H608"/>
        <path d="M346 548 H520"/>
        <path d="M346 604 H470"/>
        <path d="M346 660 H480"/>
        <path d="M346 716 H540"/>
      </g>
    </g>
    <!-- lens glass: magnified lines, one highlighted with the marker -->
    <g clip-path="url(#lens)">
      <circle cx="628" cy="592" r="150" fill="#ffffff"/>
      <g stroke-linecap="round" fill="none">
        <path d="M520 512 H760" stroke="#cfd0f3" stroke-width="34"/>
        <rect x="470" y="558" width="340" height="68" fill="#ffe083" stroke="none"/>
        <path d="M528 592 H720" stroke="#545a92" stroke-width="34"/>
        <path d="M520 672 H680" stroke="#cfd0f3" stroke-width="34"/>
      </g>
    </g>
    <!-- handle and ring -->
    <path d="M742 706 L808 772" stroke="#2f3468" stroke-width="68" stroke-linecap="round"/>
    <circle cx="628" cy="592" r="150" fill="none" stroke="#2f3468" stroke-width="42"/>
  </g>
</svg>
