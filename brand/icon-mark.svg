<svg xmlns="http://www.w3.org/2000/svg" width="610" height="610" viewBox="259 208 610 610">
  <title>PaperLens</title>
  <defs>
    <clipPath id="lens"><circle cx="628" cy="592" r="150"/></clipPath>
  </defs>
  <g>
    <!-- paper -->
    <path d="M318 220 H560 L668 328 V756 Q668 788 636 788 H318 Q286 788 286 756 V252 Q286 220 318 220 Z" fill="#dfe0ff"/>
    <!-- folded corner -->
    <path d="M560 220 V300 Q560 328 588 328 H668 Z" fill="#b9bcec"/>
    <!-- text lines -->
    <g stroke-linecap="round" fill="none">
      <path d="M346 292 H492" stroke="#545a92" stroke-width="28"/>
      <g stroke="#b9bcec" stroke-width="22">
        <path d="M346 380 H608"/>
        <path d="M346 436 H576"/>
        <path d="M346 492 H608"/>
        <path d="M346 548 H520"/>
        <path d="M346 604 H470"/>
        <path d="M346 660 H480"/>
        <path d="M346 716 H540"/>
      </g>
    </g>
    <!-- lens glass: magnified lines, one highlighted with the marker -->
    <g clip-path="url(#lens)">
      <circle cx="628" cy="592" r="150" fill="#ffffff"/>
      <g stroke-linecap="round" fill="none">
        <path d="M520 512 H760" stroke="#b9bcec" stroke-width="34"/>
        <rect x="470" y="558" width="340" height="68" fill="#ffe083" stroke="none"/>
        <path d="M528 592 H720" stroke="#545a92" stroke-width="34"/>
        <path d="M520 672 H680" stroke="#b9bcec" stroke-width="34"/>
      </g>
    </g>
    <!-- handle and ring -->
    <path d="M742 706 L808 772" stroke="#545a92" stroke-width="68" stroke-linecap="round"/>
    <circle cx="628" cy="592" r="150" fill="none" stroke="#545a92" stroke-width="42"/>
  </g>
</svg>
